<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
    rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
    crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <title>Register </title>
</head>
<body>

    <main class="container-fluid">
        <div class="row min-vh-100">
             
            <!--Left panel of the registration page-->
            <section class="col-lg-5 d-none d-lg-flex flex-column justify-content-center p-5 auth-left">
                <h1 class="display-6 mb-3">Campus Library</h1>
                <p class="fs-5">Create your free account to read books from your department and beyond.</p>
            </section>

            <!--Right panel - form area-->
            <section class="col-lg-7 d-flex align-items-center justify-content-center p-4">
                <div class="auth-card w-100">
                    <h3 class="mb-1">Create your account</h3>
                    <p class="text-muted mb-4">It takes less than a minute.</p>

                    <form action="" class="registerForm" novalidate>
                        <div class="mb-3">
                            <label for="fullName" class="form-label">Full name</label>
                            <input type="email" class="form-control" id="fullName" autocomplete="name" data-validate>
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email address</label>
                            <input type="email" class="form-control" id="email" autocomplete="email" data-validate>
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="mb-3">
                            <label for="department" class="form-label">Department</label>
                            <select id="department" class="form-select" data-validate>
                                <option value="">Select department</option>
                                <option>Computer Science</option>
                                <option>Electronics</option>
                                <option>Mechanical</option>
                                <option>Civil</option>
                            </select>
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" data-validate autocomplete="new-password">
                                <div class="invalid-feedback"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="confirmPassword" class="form-label">Password</label>
                                <input type="password" class="form-control" id="confirmPassword" data-validate autocomplete="new-password">
                                <div class="invalid-feedback"></div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="term" data-validate>
                                <label for="terms" class="form-check-label">I agree to the Library rules</label>
                                <div class="invalid-feedback"></div>
                            </div>
                        </div>

                        <button class="btn btn-lms w-100 py-2">Create account</button>
                    </form>

                    <p class="text-center mt-4 mb-0">Already registered ? <a href="index.html">Login</a></p>
                </div>
            </section>
        </div>
    </main>

    <script src="js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
    crossorigin="anonymous"></script>
</body>
</html>
