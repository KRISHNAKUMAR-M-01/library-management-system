<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <title>Login</title>
</head>

<body>

    <main class="container-fluid">
        <div class="row min-vh-100">

            <!--Left panel - Campus Library Welcome Banner-->
            <section class="col-lg-5 d-none d-lg-flex flex-column justify-content-center p-5 auth-left">
                <h1 class="display-6 mb-3">Campus Library</h1>
                <p class="fs-5">Every Department's textbooks in one place. Log in and start reading</p>
            </section>

            <!--Right panel - Login Form-->
            <section class="col-lg-7 d-flex align-items-center justify-content-center p-4">
                <div class="auth-card w-100">
                    <h3 class="mb-1">Welcome Back</h3>
                    <p class="text-muted mb-4">Log in to browse books</p>
                    
                    <div id="formAlert" class="alert d-none" role="alert"></div>
                    
                    <form action="" id="loginForm" novalidate>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email address</label>
                            <input type="email" class="form-control" id="email" autocomplete="email" data-validate>
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="mb-3">
                            <label for="loginPassword" class="form-label">Password</label>
                            <input type="password" class="form-control" id="loginPassword"
                                autocomplete="current-password" data-validate>
                            <div class="invalid-feedback"></div>
                        </div>

                        <button class="btn btn-lms w-100 py-2" type="submit">Log in</button>
                    </form>

                    <p class="text-center mt-4 mb-0">New here? <a href="register.html">Create an account</a></p>
                </div>
            </section>
        </div>
    </main>

    <script src="js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
